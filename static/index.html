<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whitespace · Servinformación</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08050f; --primary:#49196b; --primary-hi:#7b3fb0; --primary-lt:#c9a6ee;
  --card:#130b20; --card-2:#1a0f2b; --line:rgba(201,166,238,.16);
  --text:#f1ecf8; --muted:#a699bb; --muted-2:#6f6285;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --mid:#a78bfa;
  --r-lg:22px; --r-md:14px; --shadow:0 18px 44px rgba(0,0,0,.5);
}
.lv-ok{--c:var(--ok)} .lv-warn{--c:var(--warn)} .lv-bad{--c:var(--bad)}
.lv-mid{--c:var(--mid)} .lv-off{--c:var(--muted-2)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);font-size:14px;line-height:1.5;display:flex;flex-direction:column;color-scheme:dark;
  background:
    radial-gradient(900px 500px at 0% 0%,rgba(73,25,107,.5),transparent 60%),
    radial-gradient(700px 500px at 100% 100%,rgba(73,25,107,.3),transparent 60%),
    var(--bg);
}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}

/* HEADER */
header{height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;background:rgba(8,5,15,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:38px;width:auto;display:block}
.brand-tag{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--primary-lt);
  background:rgba(73,25,107,.3);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.uso{display:flex;align-items:center;gap:10px;min-width:220px;justify-content:flex-end;
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.uso span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.uso .barra{width:92px;height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.uso .barra i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c,var(--ok));transition:width .3s ease}
#usoTxt{font-size:12px;font-weight:700}

/* LAYOUT */
main{flex:1;display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);min-height:0;gap:20px;padding:20px}
aside{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.sel{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
label{display:block;margin-bottom:9px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
input[type="text"],input#ejec{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;
  background:rgba(255,255,255,.05);color:var(--text);transition:.2s ease}
input::placeholder{color:var(--muted-2)}
input:focus{outline:none;border-color:var(--primary-hi);box-shadow:0 0 0 4px rgba(123,63,176,.25)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--text)}
.kpi.lv-ok b{color:var(--ok)}
.kpi small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}

.filtros{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.filtros button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:999px;padding:8px 6px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s ease}
.filtros button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.filtros button .cnt{font-size:11px;opacity:.75}
.filtros button:hover{color:var(--text);border-color:var(--c)}
.filtros button.on{color:#fff;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}

.lista{overflow-y:auto;flex:1;padding:10px}
.item{position:relative;padding:12px 14px 12px 18px;margin-bottom:8px;border-radius:var(--r-md);cursor:pointer;
  background:var(--card-2);border:1px solid transparent;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;transition:.2s ease}
.item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 4px 4px 0;background:var(--c);opacity:.6}
.item:hover{border-color:var(--line);transform:translateX(2px)}
.item.on{border-color:var(--primary-hi);background:rgba(123,63,176,.18)}
.item .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .bar{margin-top:8px;height:3px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.item .bar i{display:block;height:100%;border-radius:inherit;background:rgba(201,166,238,.4)}
.item .right{text-align:right}
.item .sc{font-size:16px;font-weight:800;letter-spacing:-.03em;color:var(--text);line-height:1.1;margin-bottom:4px}
.item .tag{background:none;border:none;padding:0;color:var(--muted)}
.sin{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}

/* TAGS / BADGES (semáforo) */
.tag,.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;
  white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.tag::before,.badge.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.Alta{--c:var(--ok)} .Media{--c:var(--warn)} .Baja{--c:var(--bad)}
.badge.neutral{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}

/* CONTENIDO */
section{overflow-y:auto;min-height:0;padding:0 6px 24px}
.vacio{min-height:360px;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
  color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r-lg)}
.vacio h2{color:var(--text);font-size:22px;font-weight:700;margin-bottom:8px}

.cab{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.cab>div:first-child{flex:1;min-width:220px}
.cab h1{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.04em;color:#fff}
.metas{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;align-items:center}
.meta-chip{font-size:12px;color:var(--muted);font-weight:600}
.metas .badge{background:none;border:none;padding:0;color:var(--muted);font-weight:600;font-size:12px}
.prio{display:flex;align-items:center;gap:14px;color:var(--c);text-align:right}
.prio small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prio b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.prio .pn{font-size:34px;font-weight:800;padding-left:14px;border-left:1px solid var(--line);color:var(--text)}

.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:20px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}

/* HERO: producto sugerido (único protagonista) */
.hero{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--primary-hi) 45%,var(--line));
  background:linear-gradient(160deg,#2a0f42,#160a25)}
.hero .eyebrow,.hero .sub-title{color:var(--primary-lt);opacity:.8}
.reco{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:#fff}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sub-title{font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px}
.why{list-style:none;display:grid;gap:8px}
.why li{position:relative;padding-left:22px;font-size:13.5px;color:var(--text)}
.why li::before{content:"✓";position:absolute;left:0;top:0;color:var(--primary-lt);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:600;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.chip.none{color:var(--muted);background:transparent;border-style:dashed}

/* SCORE */
.score-top{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring>div{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.ring b{font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--text);line-height:1}
.ring small{font-size:11px;color:var(--muted)}
.score-top .lbl{font-size:12px;color:var(--muted)}
.score-top .val{font-size:18px;font-weight:700;color:var(--c)}
.desglose summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px;list-style:none}
.desglose summary::-webkit-details-marker{display:none}
.desglose summary::before{content:"▸ ";}
.desglose[open] summary::before{content:"▾ ";}
.desglose summary:hover{color:var(--text)}
.srow{margin-bottom:12px}
.stop{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.stop span{color:var(--text)} .stop b{color:var(--muted);font-weight:700}
.srow.lv-warn .stop b{color:var(--warn)}
.srow.lv-off .stop span{color:var(--muted-2)}
.srow.lv-off .stop b{color:var(--bad)}
.mini{height:5px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.mini i{display:block;height:100%;border-radius:inherit;background:rgba(201,166,238,.35)}
.nota{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nota b{color:var(--text)}

/* BOTONES */
.btn{background:linear-gradient(135deg,var(--primary),var(--primary-hi));color:#fff;border:1px solid rgba(201,166,238,.3);
  border-radius:999px;padding:12px 22px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 26px rgba(73,25,107,.6);transition:.2s ease}
.btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
.btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}
.btn.sec{background:transparent;color:var(--primary-lt);box-shadow:none;border:1px solid var(--line)}
.btn.sec:hover{background:rgba(73,25,107,.3)}
.header-actions{display:flex;align-items:center;gap:12px}
.header-actions .btn{padding:9px 16px;font-size:12px;white-space:nowrap}
.header-actions .err{margin:0}

/* PLAN */
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;grid-auto-flow:dense}
.pb{background:transparent;border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.pb.full{grid-column:1/-1}
.pb h4{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pb h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.1);color:var(--text)}
.pb p{font-size:14px;line-height:1.7}
.pb.quote{border-left:3px solid var(--primary-hi);background:rgba(123,63,176,.14)}
.pb.quote h4{color:var(--primary-lt)}
.pb.quote p{font-size:16px;font-style:italic;color:#fff}
.pb.obj{border-left:2px solid var(--warn)}
.pb.next{border:1px solid color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--card-2))}
.pb.next h4{color:var(--ok)} .pb.next h4 i{background:var(--ok);color:#052e1f}
.pb.next p{font-weight:600;color:#fff}

/* CHAT */
.chat{margin-top:20px;border-top:1px solid var(--line);padding-top:18px}
.msgs{max-height:300px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:rgba(0,0,0,.28)}
.msgs:empty{display:none}
.msg{padding:11px 14px;border-radius:16px;margin-bottom:9px;font-size:13px;word-wrap:break-word}
.msg.u{background:var(--primary);color:#fff;margin-left:18%;border-bottom-right-radius:4px}
.msg.a{background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.fila{display:flex;gap:8px;margin-top:12px}
.fila input{flex:1}
.fila .btn.sec{flex-shrink:0}
.err{color:var(--bad);font-size:13px;margin-top:8px;font-weight:600}
.cargando{color:var(--muted);font-style:italic}

/* RESPONSIVE */
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
@media(max-width:820px){
  header{padding:0 16px}
  main{grid-template-columns:1fr;padding:12px}
  .cab h1{font-size:26px}.reco{font-size:28px}
  .plan-grid,.two{grid-template-columns:1fr}
  .msg.u{margin-left:12%}
}
@media(max-width:540px){
  header{height:64px}.brand img{height:30px}.brand-tag{display:none}
  .header-actions{gap:6px}.header-actions .btn{padding:8px 10px;font-size:11px}
  .uso{min-width:auto;gap:6px;padding:7px 8px}.uso span{display:none}.uso .barra{width:40px}
  .card{padding:16px}.msg.u{margin-left:0}.fila{flex-direction:column}
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(201,166,238,.22);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(201,166,238,.38)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/static/logo.png" alt="Servinformación">
    <span class="brand-tag">Whitespace</span>
  </div>
  <div class="header-actions">
    <button class="btn" id="descargarReporte" type="button">Descargar reporte</button>
    <div class="uso" id="usoBox"><span>Uso</span><div class="barra"><i id="usoBar"></i></div><strong id="usoTxt">—</strong></div>
    <span class="err" id="errorReporte" role="status" aria-live="polite"></span>
  </div>
</header>
<main>
<aside>
<div class="sel">
<label for="ejec">Ejecutivo</label>
<input id="ejec" list="ejecs" placeholder="Selecciona tu nombre" autocomplete="off">
<datalist id="ejecs"></datalist>
<div class="kpis" id="kpis" hidden>
<div class="kpi"><b id="kC">0</b><small>Cuentas</small></div>
<div class="kpi lv-ok"><b id="kA">0</b><small>Alta</small></div>
<div class="kpi"><b id="kM">0</b><small>Score prom.</small></div>
</div>
</div>
<div class="filtros">
<button class="on lv-ok" data-f="Alta">Alta <span class="cnt"></span></button>
<button class="lv-warn" data-f="Media">Media <span class="cnt"></span></button>
<button class="lv-bad" data-f="Baja">Baja <span class="cnt"></span></button>
</div>
<div class="lista" id="lista"></div>
</aside>
<section id="detalle">
<div class="vacio"><h2>Selecciona un ejecutivo</h2><p>Luego elige una cuenta de tu lista</p></div>
</section>
</main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let cuentas = [], historial = [], actual = null, filtroActual = "Alta";
let ejecValido = "", nombresEjec = [];

const api = async (url, body) => {
  const r = await fetch(url, { method: body ? "POST" : "GET", headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const err = await r.json(); throw new Error(err.error || "Error"); }
  return r.json();
};

const esc = s => (new Option(s)).innerHTML;
const md = s => s.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");

/* ---- Semáforos ---- */
const nivel = (v, alto, medio) => v >= alto ? "ok" : v >= medio ? "warn" : "bad";
const PRIO = {Alta: "ok", Media: "warn", Baja: "bad"};
const fitNivel = f => nivel(f, 0.7, 0.5);
const fitTxt = f => f >= 0.7 ? "Fit alto" : f >= 0.5 ? "Fit medio" : "Fit bajo";
const scoreNivel = s => nivel(s, 60, 40);
const scoreTxt = s => s >= 60 ? "Cuenta sólida" : s >= 40 ? "Cuenta moderada" : "Cuenta débil";
const estadoNivel = e => /perdid/i.test(e || "") ? "warn" : /abiert|ganad|cliente|activ/i.test(e || "") ? "ok" : "mid";

const pintarEjecutivos = async () => {
  const ejec = await api("/api/ejecutivos");
  nombresEjec = ejec.map(e => e.nombre);
  $("#ejecs").innerHTML = nombresEjec.map(n => `<option value="${esc(n)}"></option>`).join("");
};

const pintarLista = () => {
  $$(".filtros button").forEach(b => {
    const n = cuentas.filter(c => c.prioridad === b.dataset.f).length;
    b.querySelector(".cnt").textContent = cuentas.length ? `(${n})` : "";
  });
  const filtered = cuentas.filter(c => !filtroActual || c.prioridad === filtroActual);
  if (!filtered.length) {
    $("#lista").innerHTML = `<div class="sin">${cuentas.length ? `No hay cuentas con prioridad ${filtroActual}.` : "Sin cuentas para mostrar."}</div>`;
    return;
  }
  $("#lista").innerHTML = filtered.map(c => {
    const lv = PRIO[c.prioridad] || "mid";
    const pct = Math.max(4, Math.min(100, c.score_final));
    return `<div class="item lv-${lv}${actual && c.emp === actual.emp ? " on" : ""}" onclick="abrir(${c.emp})"><div><div class="n">${esc(c.empresa)}</div><div class="s">${esc(c.MACRO)}</div><div class="bar"><i style="width:${pct}%"></i></div></div><div class="right"><div class="sc">${c.score_final.toFixed(1)}</div><span class="tag ${c.prioridad}">${c.prioridad}</span></div></div>`;
  }).join("");
};

const uso = async () => {
  const d = await api("/api/uso");
  const pct = (d.usd / d.tope) * 100;
  $("#usoTxt").textContent = `USD ${d.usd.toFixed(3)}`;
  $("#usoBar").style.width = Math.min(pct, 100) + "%";
  $("#usoBox").className = "uso lv-" + (pct < 60 ? "ok" : pct < 85 ? "warn" : "bad");
};

$("#ejec").onchange = async () => {
  const o = $("#ejec").value;
  if (!nombresEjec.includes(o)) return;
  ejecValido = o;
  cuentas = await api("/api/cuentas?owner=" + encodeURIComponent(o));
  actual = cuentas.length ? cuentas[0] : null;
  historial = [];
  const alta = cuentas.filter(c => c.prioridad === "Alta").length;
  const media = cuentas.reduce((s, c) => s + c.score_final, 0) / Math.max(cuentas.length, 1);
  $("#kC").textContent = cuentas.length;
  $("#kA").textContent = alta;
  $("#kM").textContent = media.toFixed(1);
  $("#kpis").hidden = false;
  pintarLista();
  if (actual) abrir(actual.emp);
  else $("#detalle").innerHTML = `<div class="vacio"><h2>Sin cuentas</h2><p>Este ejecutivo no tiene cuentas asignadas</p></div>`;
  uso();
};

// Al hacer clic se vacía el campo para que el dropdown muestre a todos.
// Si no eliges a nadie, se restaura el ejecutivo anterior.
$("#ejec").addEventListener("focus", e => { e.target.value = ""; });
$("#ejec").addEventListener("blur", e => {
  if (!nombresEjec.includes(e.target.value)) e.target.value = ejecValido;
});

$$(".filtros button").forEach(b => {
  b.onclick = () => {
    $$(".filtros button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    filtroActual = b.dataset.f;
    pintarLista();
  };
});

/* ---- Plan en bloques ---- */
const planHTML = t => {
  const p = t.split(/\*\*(.+?)\*\*/);
  const bloques = [];
  for (let i = 1; i < p.length; i += 2) bloques.push({ t: p[i].trim(), b: (p[i + 1] || "").trim() });
  if (!bloques.length) return `<div class="pb full"><p>${md(esc(t))}</p></div>`;
  return `<div class="plan-grid">` + bloques.map((x, i) => {
    const k = x.t.toLowerCase();
    const full = /lectura|ngulo|pregunta|siguiente/.test(k) ? " full" : "";
    let cls = "";
    if (k.includes("pregunta")) cls = " quote";
    else if (k.includes("objeci")) cls = " obj";
    else if (k.includes("siguiente")) cls = " next";
    return `<div class="pb${full}${cls}"><h4><i>${i + 1}</i>${esc(x.t)}</h4><p>${esc(x.b).replace(/\n/g, "<br>")}</p></div>`;
  }).join("") + `</div>`;
};
function abrir(id) {
  actual = cuentas.find(c => c.emp === id);
  historial = [];
  pintarLista();
  const c = actual;
  const fit = c.fit_1 ?? 0;
  const lvFit = fitNivel(fit);
  const lvPrio = PRIO[c.prioridad] || "mid";
  const lvScore = scoreNivel(c.score_cuenta);

  const p = [
    ["Cliente actual", c.pts_cliente, 30],
    ["Industria con alta penetración PP", c.pts_penetracion, 25],
    ["Compra Google sin producto propio", c.pts_whitespace, 20],
    ["Margin top 30%", c.pts_presupuesto, 15],
    ["Deal abierto", c.pts_deal_abierto, 10]
  ];
  const filas = p.map(([n, v, m]) => {
    const pct = m ? (v / m) * 100 : 0;
    const lv = v >= m ? "ok" : v > 0 ? "warn" : "off";
    return `<div class="srow lv-${lv}"><div class="stop"><span>${n}</span><b>${v}/${m}</b></div><div class="mini"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
  const razones = (c.razon_1 || "").split(";").map(x => x.trim()).filter(Boolean);
  const chips = arr => (arr.length ? arr : ["Ninguno"]).map(x => `<span class="chip${arr.length ? "" : " none"}">${esc(x)}</span>`).join("");
  const porque = razones.length
    ? `<div class="sub-title">Por qué</div><ul class="why">${razones.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`
    : "";
  const estado = c.estado_1 ? `<span class="badge neutral">${esc(c.estado_1)}</span>` : "";
  const alt = c.producto_2 ? `<span class="badge neutral">Alt: ${esc(c.producto_2)}</span>` : "";
  const deal = c.deal_abierto ? `<span class="badge dot lv-warn">Deal abierto</span>` : "";

  $("#detalle").innerHTML = `
<div class="cab">
  <div>
    <h1>${esc(c.empresa)}</h1>
    <div class="metas">
      <span class="meta-chip">${esc(c.MACRO)}</span>
      <span class="meta-chip">${esc(c.pais || "N/D")}</span>
      <span class="badge dot ${c.es_cliente ? "lv-ok" : "lv-mid"}">${c.es_cliente ? "Cliente actual" : "Prospecto"}</span>
      ${deal}
    </div>
  </div>
  <div class="prio lv-${lvPrio}">
    <div><small>Prioridad · score final</small><b>${c.prioridad}</b></div>
    <div class="pn">${c.score_final.toFixed(1)}</div>
  </div>
</div>

<div class="grid">
  <div class="card hero lv-${lvFit}">
    <div class="eyebrow">Producto propio sugerido</div>
    <div class="reco">${esc(c.producto_1 || "Sin sugerencia")}</div>
    <div class="hero-badges">
      <span class="badge dot">${fitTxt(fit)} · ${fit.toFixed(2)}</span>
      ${estado}
      ${alt}
    </div>
    ${porque}
    <div class="two">
      <div><div class="sub-title">Ya compra (Google)</div><div class="chips">${chips(c.google_comprados)}</div></div>
      <div><div class="sub-title">Producto propio actual</div><div class="chips">${chips(c.pp_ganadas)}</div></div>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">Score de la cuenta</div>
    <div class="score-top lv-${lvScore}">
      <div class="ring" style="--p:${c.score_cuenta}"><div><b>${c.score_cuenta}</b><small>/100</small></div></div>
      <div><div class="lbl">Fuerza de la cuenta</div><div class="val">${scoreTxt(c.score_cuenta)}</div></div>
    </div>
    <details class="desglose"><summary>Ver por qué ${c.score_cuenta}/100</summary>${filas}</details>
    <p class="nota"><b>${c.score_cuenta}</b> (cuenta) × <b>${fit.toFixed(2)}</b> (fit) = <b>${c.score_final.toFixed(1)}</b> score final</p>
  </div>
</div>

<div class="card">
  <div class="eyebrow">Plan de entrada</div>
  <div id="plan"><button class="btn" id="gen">Generar plan de entrada</button></div>
  <div class="chat" id="chat" hidden>
    <div class="msgs" id="msgs"></div>
    <div class="fila">
      <input id="q" type="text" placeholder="Pregunta sobre esta cuenta..." maxlength="600">
      <button class="btn sec" id="env">Enviar</button>
    </div>
    <div id="cerr" class="err"></div>
  </div>
</div>`;
  $("#gen").onclick = generarPlan;
}

async function generarPlan() {
  const b = $("#gen");
  b.disabled = true;
  b.textContent = "Preparando…";
  try {
    const d = await api("/api/plan", { emp: actual.emp });
    $("#plan").innerHTML = planHTML(d.texto);
    $("#chat").hidden = false;
    $("#msgs").innerHTML = "";
    historial = [];
    $("#q").value = "";
  } catch (e) {
    b.disabled = false;
    b.textContent = "Generar plan de entrada";
    $("#plan").insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`);
  }
  uso();
}

async function preguntar() {
  const q = $("#q").value.trim();
  if (!q) return;
  $("#q").value = "";
  $("#cerr").textContent = "";
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="msg u">${esc(q)}</div><div class="msg a cargando" id="tmp">Pensando…</div>`);
  try {
    const d = await api("/api/chat", { emp: actual.emp, pregunta: q, historial });
    if (d.historial) historial = d.historial;
    else historial.push({ role: "user", content: q }, { role: "assistant", content: d.texto });
    $("#tmp").outerHTML = `<div class="msg a">${md(esc(d.texto))}</div>`;
    $("#msgs").scrollTop = $("#msgs").scrollHeight;
  } catch (e) {
    $("#tmp").remove();
    $("#cerr").textContent = e.message;
  }
  uso();
}

pintarEjecutivos();

$("#descargarReporte").onclick = async () => {
  const button = $("#descargarReporte");
  const error = $("#errorReporte");
  button.disabled = true;
  button.textContent = "Generando…";
  error.textContent = "";
  try {
    const reporte = await api("/api/generar-reporte", {});
    window.location.href = `/reportes/${encodeURIComponent(reporte.archivo)}`;
  } catch (e) {
    error.textContent = e.message;
  } finally {
    button.disabled = false;
    button.textContent = "Descargar reporte";
  }
};

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "q") {
    e.preventDefault();
    preguntar();
  }
});

document.addEventListener("click", e => {
  if (e.target.id === "env") preguntar();
});
</script>
</body>
</html>
