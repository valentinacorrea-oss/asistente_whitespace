<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whitespace · Servinformación</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1d4ed8;
  --primary-dark: #1e3a8a;
  --primary-soft: rgba(29, 78, 216, 0.12);
  --primary-strong: #0f172a;
  --accent: #f59e0b;
  --accent-soft: rgba(245, 158, 11, 0.12);
  --success: #16a34a;
  --warning: #dc2626;
  --gray-50: #f8fafc;
  --gray-100: #eef2ff;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-700: #334155;
  --gray-900: #0f172a;
  --white: #ffffff;
  --shadow-sm: 0 8px 20px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 12px 28px rgba(15, 23, 42, 0.12);
  --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.16);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(29, 78, 216, 0.08), transparent 32%),
    radial-gradient(circle at bottom right, rgba(245, 158, 11, 0.08), transparent 28%),
    var(--gray-50);
  color: var(--gray-900);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}

button, input, select, textarea {
  font: inherit;
}

/* HEADER */
header {
  background: rgba(15, 23, 42, 0.96);
  backdrop-filter: blur(10px);
  color: var(--white);
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
  box-shadow: var(--shadow-md);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--primary), #60a5fa);
  box-shadow: 0 10px 18px rgba(59, 130, 246, 0.4);
  font-weight: 800;
  font-size: 15px;
}

.brand-copy {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand b {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.35px;
}

.brand span {
  font-size: 12px;
  opacity: 0.78;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.uso {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 8px 12px 8px 14px;
  min-width: 220px;
  justify-content: flex-end;
}

.uso span {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.8;
}

.uso .barra {
  width: 92px;
  height: 8px;
  background: rgba(255,255,255,0.18);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}

.uso .barra i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #fbbf24);
  width: 0;
  transition: width 0.3s ease;
  border-radius: inherit;
}

#usoTxt {
  font-size: 12px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0;
  text-transform: none;
  opacity: 1;
}

/* MAIN LAYOUT */
main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(270px, 340px) minmax(0, 1fr);
  min-height: 0;
}

/* SIDEBAR */
aside {
  background: rgba(255, 255, 255, 0.74);
  border-right: 1px solid var(--gray-200);
  display: flex;
  flex-direction: column;
  min-height: 0;
  backdrop-filter: blur(8px);
}

.sel {
  padding: 22px 18px 16px;
  border-bottom: 1px solid var(--gray-200);
  background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(248,250,252,0.88));
}

label {
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: block;
  margin-bottom: 9px;
}

input[type="text"],
input[type="email"],
select,
textarea {
  width: 100%;
  border: 1px solid var(--gray-300);
  border-radius: 12px;
  padding: 11px 14px;
  background: rgba(255,255,255,0.85);
  color: var(--gray-900);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

input[type="text"]::placeholder {
  color: var(--gray-400);
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: rgba(29, 78, 216, 0.7);
  box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.11);
}

.kpis {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 16px;
}

.kpi {
  background: linear-gradient(180deg, var(--white), #f8fbff);
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.kpi b {
  display: block;
  font-size: 18px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 4px;
  letter-spacing: -0.04em;
}

.kpi small {
  font-size: 10px;
  color: var(--gray-500);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.filtros {
  display: flex;
  gap: 8px;
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--gray-200);
  background: rgba(248,250,252,0.8);
}

.filtros button {
  flex: 1;
  border: 1px solid var(--gray-300);
  background: var(--white);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.2s ease;
}

.filtros button:hover {
  border-color: rgba(29, 78, 216, 0.4);
  color: var(--primary);
  transform: translateY(-1px);
}

.filtros button.on {
  border-color: transparent;
  background: linear-gradient(135deg, var(--primary), #2563eb);
  color: var(--white);
  box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
}

.lista {
  overflow-y: auto;
  flex: 1;
  background: linear-gradient(180deg, rgba(255,255,255,0.64), rgba(248,250,252,0.94));
}

.item {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
  cursor: pointer;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  transition: background 0.2s ease, transform 0.2s ease;
}

.item:hover {
  background: rgba(29, 78, 216, 0.03);
}

.item.on {
  background: linear-gradient(90deg, rgba(29, 78, 216, 0.09), rgba(29, 78, 216, 0.02));
  border-left: 3px solid var(--primary);
  padding-left: 13px;
}

.item .n {
  font-weight: 700;
  color: var(--gray-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}

.item .s {
  margin-top: 3px;
  font-size: 12px;
  color: var(--gray-500);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item .sc {
  font-weight: 800;
  color: var(--primary);
  font-size: 13px;
  margin-bottom: 4px;
}

.item .tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 60px;
}

.tag {
  font-size: 11px;
  font-weight: 700;
  padding: 5px 8px;
  border-radius: 999px;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

.Alta {
  background: rgba(220, 38, 38, 0.08);
  color: #b91c1c;
}

.Media {
  background: rgba(245, 158, 11, 0.12);
  color: #b45309;
}

.Baja {
  background: rgba(37, 99, 235, 0.1);
  color: #1d4ed8;
}

/* MAIN CONTENT */
section {
  overflow-y: auto;
  padding: 30px 28px 32px;
  min-height: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0)),
    var(--gray-50);
}

#detalle {
  position: relative;
}

.vacio {
  min-height: 360px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: var(--gray-500);
  text-align: center;
  background: rgba(255,255,255,0.52);
  border: 1px solid var(--gray-200);
  border-radius: 18px;
  box-shadow: var(--shadow-sm);
}

.vacio h2 {
  color: var(--gray-700);
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 8px;
}

.vacio p {
  font-size: 14px;
}

.cab {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.cab h1 {
  font-size: 28px;
  font-weight: 800;
  color: var(--gray-900);
  line-height: 1.15;
  letter-spacing: -0.04em;
}

.cab p {
  color: var(--gray-500);
  margin-top: 6px;
  font-size: 13px;
}

.cab > div:first-child {
  flex: 1;
  min-width: 200px;
}

.cab .tag {
  padding: 8px 12px;
  font-size: 12px;
  align-self: center;
}

.grid {
  display: grid;
  grid-template-columns: 1.25fr 0.95fr;
  gap: 20px;
  margin-bottom: 20px;
}

.card {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--gray-200);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.card h3 {
  font-size: 11px;
  font-weight: 800;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}

.reco {
  font-size: 22px;
  font-weight: 800;
  color: var(--primary);
  line-height: 1.2;
  letter-spacing: -0.03em;
}

.reco-sub {
  color: var(--gray-500);
  font-size: 13px;
  margin-top: 8px;
  font-weight: 600;
}

.porque {
  margin-top: 14px;
  font-size: 13px;
  color: var(--gray-700);
  line-height: 1.7;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.chip {
  font-size: 12px;
  border: 1px solid var(--gray-200);
  border-radius: 999px;
  padding: 6px 10px;
  background: linear-gradient(180deg, var(--white), #f8fafc);
  color: var(--gray-700);
  font-weight: 600;
}

.pts {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px 12px;
  font-size: 13px;
  color: var(--gray-700);
}

.pts span {
  color: var(--gray-700);
}

.pts span:nth-child(even) {
  font-weight: 700;
  text-align: right;
  color: var(--primary);
}

.pts .off {
  color: var(--gray-400);
  opacity: 0.6;
}

.total {
  border-top: 1px solid var(--gray-200);
  margin-top: 14px;
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 800;
  color: var(--gray-900);
}

.btn {
  background: linear-gradient(135deg, var(--primary), #2563eb);
  color: var(--white);
  border: none;
  border-radius: 12px;
  padding: 10px 16px;
  font: inherit;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
}

.btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.02);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.75;
  cursor: not-allowed;
  box-shadow: none;
}

.btn.sec {
  background: var(--white);
  color: var(--primary);
  border: 1px solid rgba(29, 78, 216, 0.25);
  box-shadow: none;
}

.btn.sec:hover {
  background: rgba(29, 78, 216, 0.03);
}

.plan {
  font-size: 14px;
  line-height: 1.8;
  color: var(--gray-800);
}

.plan strong {
  color: var(--primary);
  display: block;
  margin-top: 10px;
  font-weight: 700;
}

.plan strong:first-child {
  margin-top: 0;
}

.nota {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 12px;
  font-style: italic;
}

.chat {
  margin-top: 20px;
  border-top: 1px solid var(--gray-200);
  padding-top: 16px;
}

.msgs {
  max-height: 300px;
  overflow-y: auto;
  margin-bottom: 12px;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  padding: 12px;
  background: linear-gradient(180deg, #f8fafc, #ffffff);
}

.msg {
  padding: 11px 12px;
  border-radius: 12px;
  margin-bottom: 9px;
  line-height: 1.5;
  font-size: 13px;
  word-wrap: break-word;
}

.msg.u {
  background: rgba(29, 78, 216, 0.08);
  color: var(--primary);
  margin-left: 18%;
  border: 1px solid rgba(29, 78, 216, 0.08);
  font-weight: 600;
}

.msg.a {
  background: var(--white);
  color: var(--gray-800);
  border: 1px solid var(--gray-200);
  margin-right: 0;
}

.fila {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.fila input {
  flex: 1;
}

.fila .btn.sec {
  flex-shrink: 0;
  padding: 10px 16px;
}

.err {
  color: var(--warning);
  font-size: 13px;
  margin-top: 8px;
  font-weight: 600;
}

.cargando {
  color: var(--gray-500);
  font-style: italic;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 820px) {
  header {
    padding: 0 16px;
  }

  main {
    grid-template-columns: 1fr;
  }

  aside {
    border-right: none;
    border-bottom: 1px solid var(--gray-200);
  }

  section {
    padding: 20px 16px 24px;
  }

  .cab {
    flex-direction: column;
    gap: 12px;
  }

  .cab h1 {
    font-size: 24px;
  }

  .msg.u {
    margin-left: 12%;
  }
}

@media (max-width: 540px) {
  header {
    height: 68px;
  }

  .brand-copy {
    gap: 6px;
  }

  .brand span {
    letter-spacing: 0.04em;
    font-size: 10px;
  }

  .uso {
    min-width: auto;
    gap: 8px;
    padding: 7px 10px;
  }

  .uso .barra {
    width: 70px;
  }

  #usoTxt {
    font-size: 11px;
  }

  .sel {
    padding: 16px 14px 14px;
  }

  .kpis {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .kpi {
    padding: 10px 8px;
  }

  .kpi b {
    font-size: 16px;
  }

  .kpi small {
    font-size: 9px;
  }

  .card {
    padding: 16px;
  }

  .reco {
    font-size: 18px;
  }

  .btn {
    padding: 9px 14px;
    font-size: 13px;
  }

  .msg.u {
    margin-left: 0;
  }

  .fila {
    flex-direction: column;
  }
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--gray-100);
}

::-webkit-scrollbar-thumb {
  background: var(--gray-300);
  border-radius: 6px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--gray-400);
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">S</div>
    <div class="brand-copy"><b>Servinformación</b><span>Whitespace</span></div>
  </div>
  <div class="uso"><span>Uso</span><div class="barra"><i id="usoBar"></i></div><strong id="usoTxt">—</strong></div>
</header>
<main>
  <aside>
    <div class="sel">
      <label for="ejec">Ejecutivo</label>
      <input id="ejec" list="ejecs" placeholder="Selecciona tu nombre" autocomplete="off">
      <datalist id="ejecs"></datalist>
      <div class="kpis" id="kpis" hidden>
        <div class="kpi"><b id="kC">0</b><small>Cuentas</small></div>
        <div class="kpi"><b id="kA">0</b><small>Alta</small></div>
        <div class="kpi"><b id="kM">0</b><small>Score</small></div>
      </div>
    </div>
    <div class="filtros">
      <button class="on" data-f="Alta">Alta</button>
      <button data-f="Media">Media</button>
      <button data-f="Baja">Baja</button>
    </div>
    <div class="lista" id="lista"></div>
  </aside>
  <section id="detalle">
    <div class="vacio"><h2>Selecciona un ejecutivo</h2><p>Luego elige una cuenta de tu lista</p></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let cuentas = [], historial = [], actual = null, filtroActual = "Alta";

const api = async (url, body) => {
  const r = await fetch(url, { method: body ? "POST" : "GET", headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) {const err = await r.json(); throw new Error(err.error || "Error");}
  return r.json();
};

const esc = s => (new Option(s)).innerHTML;
const md = s => s.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");

const pintarEjecutivos = async () => {
  const ejec = await api("/api/ejecutivos");
  $("#ejecs").innerHTML = ejec.map(e => `<option>${e.nombre}</option>`).join("");
};

const pintarLista = () => {
  if (!actual) return;
  const filtered = cuentas.filter(c => !filtroActual || c.prioridad === filtroActual);
  $("#lista").innerHTML = filtered.map(c => `<div class="item${c.emp === actual.emp ? " on" : ""}" onclick="abrir(${c.emp})"><div><div class="n">${esc(c.empresa)}</div><div class="s">${esc(c.MACRO)}</div></div><div style="text-align:right;font-size:11px"><div class="sc">${c.score_final.toFixed(1)}</div><span class="tag ${c.prioridad}">${c.prioridad}</span></div></div>`).join("");
};

const uso = async () => {
  const d = await api("/api/uso");
  const pct = (d.usd / d.tope) * 100;
  $("#usoTxt").textContent = `USD ${d.usd.toFixed(3)}`;
  $("#usoBar").style.width = Math.min(pct, 100) + "%";
};

$("#ejec").onchange = async () => {
  const o = $("#ejec").value;
  if (!o) return;
  cuentas = await api("/api/cuentas?owner=" + encodeURIComponent(o));
  actual = cuentas.length ? cuentas[0] : null;
  historial = [];
  const alta = cuentas.filter(c => c.prioridad === "Alta").length;
  const media = cuentas.filter(c => c.prioridad === "Media").reduce((s, c) => s + c.score_final, 0) / Math.max(cuentas.filter(c => c.prioridad === "Media").length, 1);
  $("#kC").textContent = cuentas.length;
  $("#kA").textContent = alta;
  $("#kM").textContent = media.toFixed(1);
  $("#kpis").hidden = false;
  pintarLista();
  if (actual) abrir(actual.emp);
  uso();
};

$$(".filtros button").forEach(b => {
  b.onclick = () => {
    $$(".filtros button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    filtroActual = b.dataset.f;
    pintarLista();
  };
});

function abrir(id) {
  actual = cuentas.find(c => c.emp === id);
  historial = [];
  pintarLista();
  const c = actual;
  const p = [["Cliente actual",c.pts_cliente,30],["Industria con alta penetración PP",c.pts_penetracion,25],["Compra Google sin producto propio",c.pts_whitespace,20],["Margin top 30%",c.pts_presupuesto,15],["Deal abierto",c.pts_deal_abierto,10]];
  $("#detalle").innerHTML = `<div class="cab"><div><h1>${esc(c.empresa)}</h1><p>${esc(c.MACRO)} · ${esc(c.pais||"N/D")} · ${c.es_cliente?"Cliente actual":"Prospecto"}</p></div><span class="tag ${c.prioridad}">Prioridad ${c.prioridad} · ${c.score_final.toFixed(1)}</span></div><div class="grid"><div class="card"><h3>Producto propio sugerido</h3><div class="reco">${esc(c.producto_1||"Sin sugerencia")}</div><div class="reco-sub">Fit ${(c.fit_1??0).toFixed(2)} · ${esc(c.estado_1||"")}${c.producto_2?" · Alt: "+esc(c.producto_2):""}</div><div class="porque">${esc((c.razon_1||"").replace(/;/g," · "))}</div><h3 style="margin-top:16px">Ya compra (Google)</h3><div class="chips">${(c.google_comprados.length?c.google_comprados:["Ninguno"]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div><h3 style="margin-top:14px">Producto propio actual</h3><div class="chips">${(c.pp_ganadas.length?c.pp_ganadas:["Ninguno"]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div><div class="card"><h3>Score de la cuenta</h3><div class="pts">${p.map(([n,v,m])=>`<span class="${v?"":"off"}">${n}</span><span class="${v?"":"off"}">${v}/${m}</span>`).join("")}</div><div class="total"><span>Total cuenta</span><span>${c.score_cuenta}/100</span></div><p class="nota">Score final = score de cuenta × fit del producto.</p></div></div><div class="card"><h3>Plan de entrada</h3><div id="plan"><button class="btn" id="gen">Generar plan de entrada</button></div><div class="chat" id="chat" hidden><div class="msgs" id="msgs"></div><div class="fila"><input id="q" type="text" placeholder="Pregunta sobre esta cuenta..." maxlength="600"><button class="btn sec" id="env">Enviar</button></div><div id="cerr" class="err"></div></div></div>`;
  $("#gen").onclick = generarPlan;
}

async function generarPlan() {
  const b = $("#gen");
  b.disabled = true;
  b.textContent = "Preparando…";
  try {
    const d = await api("/api/plan", {emp: actual.emp});
    $("#plan").innerHTML = `<div class="plan">${md(d.texto)}</div>`;
    $("#chat").hidden = false;
    $("#msgs").innerHTML = "";
    historial = [];
    $("#q").value = "";
  } catch (e) {
    b.disabled = false;
    b.textContent = "Generar plan";
    $("#plan").insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`);
  }
  uso();
}

async function preguntar() {
  const q = $("#q").value.trim();
  if (!q) return;
  $("#q").value = "";
  $("#cerr").textContent = "";
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="msg u">${esc(q)}</div><div class="msg a cargando" id="tmp">Pensando…</div>`);
  try {
    const d = await api("/api/chat", {emp: actual.emp, pregunta: q, historial});
    if (d.historial) historial = d.historial;
    else historial.push({role:"user",content:q},{role:"assistant",content:d.texto});
    $("#tmp").outerHTML = `<div class="msg a">${md(d.texto)}</div>`;
    $("#msgs").scrollTop = $("#msgs").scrollHeight;
  } catch (e) {
    $("#tmp").remove();
    $("#cerr").textContent = e.message;
  }
  uso();
}

pintarEjecutivos();

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "q") {
    e.preventDefault();
    preguntar();
  }
});

document.addEventListener("click", e => {
  if (e.target.id === "env") preguntar();
});
</script>
</body>
</html>
