<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whitespace · Servinformación</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08050f; --primary:#49196b; --primary-hi:#7b3fb0; --primary-lt:#c9a6ee;
  --card:#130b20; --card-2:#1a0f2b; --line:rgba(201,166,238,.16);
  --text:#f1ecf8; --muted:#a699bb; --muted-2:#6f6285;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --mid:#a78bfa;
  --r-lg:20px; --r-md:12px; --shadow:0 18px 44px rgba(0,0,0,.5);
}
.lv-ok{--c:var(--ok)} .lv-warn{--c:var(--warn)} .lv-bad{--c:var(--bad)} .lv-mid{--c:var(--mid)} .lv-off{--c:var(--muted-2)}
.Alta{--c:var(--ok)} .Media{--c:var(--warn)} .Baja{--c:var(--bad)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;color-scheme:dark;
  background:radial-gradient(900px 500px at 0% 0%,rgba(73,25,107,.5),transparent 60%),
             radial-gradient(700px 500px at 100% 100%,rgba(73,25,107,.3),transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* HEADER */
header{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  background:rgba(8,5,15,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:34px;width:auto;display:block}
.brand-tag{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--primary-lt);
  background:rgba(73,25,107,.3);border:1px solid var(--line);padding:5px 12px;border-radius:999px}
.uso{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);cursor:default}
.uso .barra{width:64px;height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.uso .barra i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c,var(--ok));transition:width .3s}

/* PÁGINA */
main{flex:1;min-height:0;overflow-y:auto;padding:22px 28px 40px;max-width:1500px;width:100%;margin:0 auto}

/* BARRA SUPERIOR: ejecutivo + KPIs */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.sel{min-width:280px;flex:0 1 340px}
label{display:block;margin-bottom:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
select,input[type=text]{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;background:rgba(255,255,255,.05);transition:.2s}
select option{background:#1a0f2b;color:#f1ecf8}
select:focus,input:focus{outline:none;border-color:var(--primary-hi);box-shadow:0 0 0 4px rgba(123,63,176,.25)}
input::placeholder{color:var(--muted-2)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{min-width:112px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 16px}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.kpi small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kpi.lv-ok b{color:var(--ok)} .kpi.lv-warn b{color:var(--warn)}

/* TABS + FILTROS */
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:8px 18px;border-radius:999px;cursor:pointer;transition:.2s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:linear-gradient(135deg,var(--primary),var(--primary-hi));color:#fff}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools input{width:240px;padding:9px 14px;font-size:13px}
.chip-f{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.chip-f[data-f]:not([data-f=Todas])::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip-f:hover{color:var(--text);border-color:var(--c,var(--primary-hi))}
.chip-f.on{color:#fff;border-color:var(--c,var(--primary-hi));background:color-mix(in srgb,var(--c,var(--primary-hi)) 16%,transparent)}
.chip-f .cnt{opacity:.7;font-weight:600}

/* BOTONES */
.btn{background:linear-gradient(135deg,var(--primary),var(--primary-hi));color:#fff;border:1px solid rgba(201,166,238,.3);
  border-radius:999px;padding:11px 22px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.15)} .btn:disabled{opacity:.6;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--primary-lt);border-color:var(--line)}
.btn.sec:hover{background:rgba(73,25,107,.3)}
.btn.sm{padding:8px 14px;font-size:12px}

/* TABLA */
.tabla-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:920px}
th{position:sticky;top:0;background:#1a0f2b;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.07em;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th[data-s]{cursor:pointer;user-select:none} th[data-s]:hover{color:var(--text)}
th .ar{color:var(--primary-lt)}
td{padding:11px 14px;border-bottom:1px solid rgba(201,166,238,.08);vertical-align:middle;font-size:13px}
tbody tr{cursor:pointer;transition:background .15s} tbody tr:hover,tbody tr:focus{background:rgba(123,63,176,.16);outline:none}
tbody tr:last-child td{border-bottom:0}
td .n{font-weight:700} td .s{font-size:12px;color:var(--muted)}
td.sc{white-space:nowrap}
.sc b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sc .bar{margin-top:5px;width:70px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.sc .bar i{display:block;height:100%;border-radius:inherit;background:var(--c)}
.mini-chip{display:inline-block;font-size:11px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:0 4px 4px 0;white-space:nowrap}
.sin{padding:40px 16px;text-align:center;color:var(--muted)}
.pie{margin-top:10px;font-size:12px;color:var(--muted-2)}

/* TAGS */
.tag,.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.tag::before,.badge.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.badge.neutral{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.sub-title{font-size:11px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.vacio{min-height:340px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--r-lg)}
.vacio h2{color:var(--text);font-size:22px;font-weight:700;margin-bottom:8px}

/* PRODUCTOS */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.prod{border-left:4px solid var(--primary-hi)}
.prod h3{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prod h3 small{font-size:12px;font-weight:600;color:var(--muted)}
.prod .qr{font-size:13px;color:var(--muted);margin:6px 0 12px}
.gancho{background:rgba(123,63,176,.16);border-left:3px solid var(--primary-hi);border-radius:8px;padding:10px 14px;font-style:italic;font-size:13px;margin-bottom:12px}
.ctas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ctas button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.ctas button:hover{border-color:var(--primary-hi);background:rgba(123,63,176,.2)}
.ctas button.alta{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}

details.mas{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.mas summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--primary-lt);list-style:none}
details.mas summary::-webkit-details-marker{display:none}
details.mas summary::before{content:"▸ "} details.mas[open] summary::before{content:"▾ "}

/* FICHA DE VENTA */
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.ficha .full{grid-column:1/-1}
.ficha h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.ficha ul{list-style:none;display:grid;gap:6px}
.ficha li{position:relative;padding-left:16px;font-size:13px}
.ficha li::before{content:"•";position:absolute;left:2px;color:var(--primary-lt)}
.ficha p{font-size:13px}
.roi{color:var(--ok);font-weight:700}
.obj{background:rgba(255,255,255,.05);border-left:3px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:13px}

/* DETALLE */
.back{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.cab{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.cab h1{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.04em}
.metas{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.prio{display:flex;align-items:center;gap:14px;color:var(--c);text-align:right}
.prio small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.prio b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.prio .pn{font-size:34px;font-weight:800;padding-left:14px;border-left:1px solid var(--line);color:var(--text)}
.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin-bottom:18px}
.hero{border-color:color-mix(in srgb,var(--primary-hi) 45%,var(--line));background:linear-gradient(160deg,#2a0f42,#160a25)}
.hero .eyebrow,.hero .sub-title{color:var(--primary-lt);opacity:.8}
.reco{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.1;color:#fff}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.why{list-style:none;display:grid;gap:7px}
.why li{position:relative;padding-left:22px;font-size:13.5px}
.why li::before{content:"✓";position:absolute;left:0;color:var(--primary-lt);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.chip.none{color:var(--muted);background:transparent;border-style:dashed}
.score-top{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring>div{width:73px;height:73px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.ring b{font-size:24px;font-weight:800;line-height:1} .ring small{font-size:11px;color:var(--muted)}
.score-top .lbl{font-size:12px;color:var(--muted)} .score-top .val{font-size:17px;font-weight:700;color:var(--c)}
.srow{margin-bottom:11px}
.stop{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px}
.stop b{color:var(--muted);font-weight:700}
.srow.lv-warn .stop b{color:var(--warn)} .srow.lv-ok .stop b{color:var(--ok)} .srow.lv-off .stop span{color:var(--muted-2)}
.mini{height:5px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.mini i{display:block;height:100%;border-radius:inherit;background:rgba(201,166,238,.4)}
.nota{font-size:12px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.nota b{color:var(--text)}

/* PLAN IA */
.plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;grid-auto-flow:dense}
.pb{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.pb.full{grid-column:1/-1}
.pb h4{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pb h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.1);color:var(--text)}
.pb p{font-size:14px;line-height:1.65}
.pb.quote{border-left:3px solid var(--primary-hi);background:rgba(123,63,176,.14)} .pb.quote p{font-size:15px;font-style:italic;color:#fff}
.pb.obj2{border-left:2px solid var(--warn)}
.pb.next{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--card-2))}
.pb.next h4{color:var(--ok)} .pb.next p{font-weight:600;color:#fff}
.hint{font-size:12px;color:var(--muted);margin-bottom:12px}
.chat{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.msgs{max-height:300px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:rgba(0,0,0,.28)}
.msgs:empty{display:none}
.msg{padding:10px 14px;border-radius:16px;margin-bottom:8px;font-size:13px;word-wrap:break-word}
.msg.u{background:var(--primary);margin-left:18%;border-bottom-right-radius:4px}
.msg.a{background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.fila{display:flex;gap:8px} .fila input{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:8px;font-weight:600}
.cargando{color:var(--muted);font-style:italic}

@media(max-width:1100px){.grid{grid-template-columns:1fr}.prods{grid-template-columns:1fr}}
@media(max-width:820px){
  header{padding:0 16px} main{padding:16px 14px 32px}
  .cab h1{font-size:26px} .reco{font-size:26px}
  .plan-grid,.two,.ficha{grid-template-columns:1fr} .msg.u{margin-left:8%}
  .tools input{width:100%} .tools{width:100%}
}
@media(max-width:540px){.brand-tag{display:none}.uso span{display:none}.fila{flex-direction:column}}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:rgba(201,166,238,.22);border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/static/logo.png" alt="Servinformación"><span class="brand-tag">Whitespace</span></div>
  <div class="uso lv-ok" id="usoBox" title="Consumo de IA hoy"><span>IA hoy</span><div class="barra"><i id="usoBar"></i></div><strong id="usoTxt">—</strong></div>
</header>

<main>
  <div class="top">
    <div class="sel">
      <label for="ejec">Ejecutivo</label>
      <select id="ejec"><option value="">Selecciona un ejecutivo…</option></select>
    </div>
    <div class="kpis" id="kpis" hidden></div>
  </div>

  <div class="nav" id="nav" hidden>
    <div class="tabs" role="tablist">
      <button class="on" data-v="cuentas" role="tab">Cuentas</button>
      <button data-v="productos" role="tab">Qué vender</button>
    </div>
    <div class="tools">
      <input type="text" id="q" placeholder="Buscar empresa, industria o producto…" aria-label="Buscar">
      <div id="filtros"></div>
      <button class="btn sec sm" id="btnCsv" type="button" title="Descarga la vista actual para abrirla en Excel">Descargar Excel</button>
    </div>
  </div>

  <div id="vista"><div class="vacio"><h2>Selecciona un ejecutivo</h2><p>Verás sus cuentas, qué producto ofrecer a cada una y cómo abrir la conversación.</p></div></div>
</main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const md = s => s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");
const api = async (url, body) => {
  const r = await fetch(url, { method: body ? "POST" : "GET", headers: {"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error");
  return d;
};

const S = { cuentas: [], cat: {}, vista: "cuentas", filtro: "Todas", q: "", sort: { k: "prio", d: 1 }, actual: null, historial: [] };
const RANK = { Alta: 0, Media: 1, Baja: 2 };
const PRIO = { Alta: "ok", Media: "warn", Baja: "bad" };
const nivel = (v, a, m) => v >= a ? "ok" : v >= m ? "warn" : "bad";
const fitTxt = f => f >= .7 ? "Fit alto" : f >= .5 ? "Fit medio" : "Fit bajo";
const scoreTxt = s => s >= 60 ? "Cuenta sólida" : s >= 40 ? "Cuenta moderada" : "Cuenta débil";

/* ---------- datos derivados ---------- */
const visibles = () => {
  const q = norm(S.q.trim());
  const k = S.sort.k, d = S.sort.d;
  const val = c => k === "empresa" ? norm(c.empresa) : k === "producto" ? norm(c.producto_1) : k === "fit" ? c.fit_1 ?? 0 : c.score_final;
  return S.cuentas
    .filter(c => (S.filtro === "Todas" || c.prioridad === S.filtro) &&
      (!q || norm([c.empresa, c.MACRO, c.pais, c.producto_1, c.producto_2].join(" ")).includes(q)))
    .sort((a, b) => {
      if (k === "prio") return (RANK[a.prioridad] - RANK[b.prioridad]) * d || b.score_final - a.score_final;
      const x = val(a), y = val(b);
      return (x > y ? 1 : x < y ? -1 : 0) * (k === "empresa" || k === "producto" ? d : -d);
    });
};

/* ---------- cabecera: KPIs, filtros ---------- */
const pintarKpis = () => {
  const c = S.cuentas, n = p => c.filter(x => x.prioridad === p).length;
  const prom = c.reduce((s, x) => s + x.score_final, 0) / Math.max(c.length, 1);
  const k = (v, l, lv = "") => `<div class="kpi ${lv}"><b>${v}</b><small>${l}</small></div>`;
  $("#kpis").innerHTML = k(c.length, "Cuentas") + k(n("Alta"), "Prioridad alta", "lv-ok") + k(n("Media"), "Prioridad media", "lv-warn") + k(prom.toFixed(1), "Score promedio");
  $("#kpis").hidden = false;
};
const pintarFiltros = () => {
  $("#filtros").innerHTML = ["Todas", "Alta", "Media", "Baja"].map(f => {
    const n = f === "Todas" ? S.cuentas.length : S.cuentas.filter(c => c.prioridad === f).length;
    return `<button class="chip-f ${f}${S.filtro === f ? " on" : ""}" data-f="${f}">${f} <span class="cnt">${n}</span></button>`;
  }).join(" ");
};

/* ---------- vista: tabla de cuentas ---------- */
const COLS = [["empresa","Empresa"],["prio","Prioridad"],["score","Score"],["producto","Producto sugerido"],["fit","Fit"],[null,"Alternativa"],[null,"Ya compra (Google)"],[null,"Estado"]];
const pintarCuentas = () => {
  const v = visibles();
  const th = COLS.map(([k, t]) => k ? `<th data-s="${k}">${t}${S.sort.k === k ? ` <span class="ar">${S.sort.d > 0 ? "▲" : "▼"}</span>` : ""}</th>` : `<th>${t}</th>`).join("");
  const filas = v.map(c => {
    const g = c.google_comprados || [];
    const chips = g.slice(0, 2).map(x => `<span class="mini-chip">${esc(x)}</span>`).join("") + (g.length > 2 ? `<span class="mini-chip" title="${esc(g.slice(2).join(", "))}">+${g.length - 2}</span>` : "");
    const est = [c.es_cliente ? `<span class="badge dot lv-ok">Cliente</span>` : `<span class="badge dot lv-mid">Prospecto</span>`,
                 c.deal_abierto ? `<span class="badge dot lv-warn">Deal abierto</span>` : ""].join(" ");
    return `<tr data-id="${c.emp}" tabindex="0">
      <td><div class="n">${esc(c.empresa)}</div><div class="s">${esc(c.MACRO)} · ${esc(c.pais || "N/D")}</div></td>
      <td><span class="tag ${c.prioridad}">${c.prioridad}</span></td>
      <td class="sc ${c.prioridad}"><b>${c.score_final.toFixed(1)}</b><div class="bar"><i style="width:${Math.max(4, Math.min(100, c.score_final))}%"></i></div></td>
      <td><b>${esc(c.producto_1 || "—")}</b>${c.estado_1 && c.estado_1 !== "Nuevo" ? `<div class="s">${esc(c.estado_1)}</div>` : ""}</td>
      <td>${(c.fit_1 ?? 0).toFixed(2)}</td>
      <td>${esc(c.producto_2 || "—")}</td>
      <td>${chips || `<span class="s">Sin dato</span>`}</td>
      <td>${est}</td></tr>`;
  }).join("");
  $("#vista").innerHTML = v.length
    ? `<div class="tabla-wrap"><table><thead><tr>${th}</tr></thead><tbody>${filas}</tbody></table></div><div class="pie">${v.length} de ${S.cuentas.length} cuentas · clic en una fila para ver cómo abordarla</div>`
    : `<div class="vacio"><h2>Sin resultados</h2><p>Ajusta la búsqueda o el filtro de prioridad.</p></div>`;
};

/* ---------- ficha de venta (catálogo) ---------- */
const lista = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
const fichaHTML = f => `<div class="ficha">
  ${f.gancho ? `<div class="full"><div class="gancho">💬 ${esc(f.gancho)}</div></div>` : ""}
  ${f.dolores.length ? `<div><h4>🎯 Lo que dirá el cliente</h4>${lista(f.dolores)}</div>` : ""}
  ${f.preguntas.length ? `<div><h4>❓ Preguntas para descubrir</h4>${lista(f.preguntas)}</div>` : ""}
  ${f.senales.length ? `<div class="full"><h4>🔎 Señales de compra a revisar antes de llamar</h4>${lista(f.senales)}</div>` : ""}
  <div><h4>👤 Sponsor</h4><p>${esc(f.sponsor || "—")}</p></div>
  <div><h4>Influenciadores</h4><p>${esc(f.influenciadores.join(", ") || "—")}</p></div>
  ${f.roi.length ? `<div class="full"><h4>💰 Impacto</h4><p class="roi">${esc(f.roi.join(" · "))}</p></div>` : ""}
  ${f.objecion && f.respuesta ? `<div class="full"><div class="obj"><b>🛡️ Si te dicen:</b> “${esc(f.objecion)}”<br><b>Responde:</b> ${esc(f.respuesta)}</div></div>` : ""}
  ${f.caso_uso ? `<div class="full"><h4>📌 Caso de uso</h4><p>${esc(f.caso_uso)}</p></div>` : ""}
</div>`;

/* ---------- vista: qué vender (agrupado por producto) ---------- */
const pintarProductos = () => {
  const v = visibles();
  const g = {};
  v.forEach(c => (g[c.producto_1 || "Sin producto"] = g[c.producto_1 || "Sin producto"] || []).push(c));
  const orden = Object.keys(g).sort((a, b) => g[b].length - g[a].length);
  $("#vista").innerHTML = orden.length ? `<div class="prods">${orden.map(p => {
    const f = S.cat[p], cs = g[p];
    return `<div class="card prod">
      <h3>${esc(p)} <small>${cs.length} cuenta(s)${f && f.categoria ? " · " + esc(f.categoria) : ""}</small></h3>
      ${f ? `<p class="qr">${esc(f.que_resuelve)}</p>${f.gancho ? `<div class="gancho">💬 ${esc(f.gancho)}</div>` : ""}` : ""}
      <div class="eyebrow" style="margin:10px 0 0">Aplica a</div>
      <div class="ctas">${cs.map(c => `<button data-id="${c.emp}" class="${c.prioridad === "Alta" ? "alta" : ""}">${esc(c.empresa)}</button>`).join("")}</div>
      ${f ? `<details class="mas"><summary>Cómo venderlo</summary><div style="margin-top:14px">${fichaHTML(f)}</div></details>` : ""}
    </div>`;
  }).join("")}</div><div class="pie">Agrupado por producto sugerido. Las cuentas en verde son prioridad Alta.</div>`
  : `<div class="vacio"><h2>Sin resultados</h2><p>Ajusta la búsqueda o el filtro de prioridad.</p></div>`;
};

/* ---------- detalle de cuenta ---------- */
const planHTML = t => {
  const p = t.split(/\*\*(.+?)\*\*/), b = [];
  for (let i = 1; i < p.length; i += 2) b.push({ t: p[i].trim(), b: (p[i + 1] || "").trim() });
  if (!b.length) return `<div class="pb full"><p>${md(esc(t))}</p></div>`;
  return `<div class="plan-grid">` + b.map((x, i) => {
    const k = x.t.toLowerCase();
    const full = /lectura|ngulo|pregunta|siguiente/.test(k) ? " full" : "";
    const cls = k.includes("pregunta") ? " quote" : k.includes("objeci") ? " obj2" : k.includes("siguiente") ? " next" : "";
    return `<div class="pb${full}${cls}"><h4><i>${i + 1}</i>${esc(x.t)}</h4><p>${esc(x.b).replace(/\n/g, "<br>")}</p></div>`;
  }).join("") + `</div>`;
};

function abrir(id) {
  const c = S.cuentas.find(x => x.emp === id);
  if (!c) return;
  S.actual = c; S.vista = "detalle"; S.historial = [];
  $("#nav").hidden = true;
  const lista_ = visibles(), i = lista_.findIndex(x => x.emp === id);
  const fit = c.fit_1 ?? 0, lvFit = nivel(fit, .7, .5), lvScore = nivel(c.score_cuenta, 60, 40);
  const pts = [["Cliente actual", c.pts_cliente, 30], ["Industria con alta penetración PP", c.pts_penetracion, 25], ["Compra Google sin producto propio", c.pts_whitespace, 20],
               ["Margin top 30%", c.pts_presupuesto, 15], ["Deal abierto", c.pts_deal_abierto, 10]];
  const filas = pts.map(([n, v, m]) => `<div class="srow lv-${v >= m ? "ok" : v > 0 ? "warn" : "off"}"><div class="stop"><span>${n}</span><b>${v}/${m}</b></div><div class="mini"><i style="width:${(v / m) * 100}%"></i></div></div>`).join("");
  const razones = (c.razon_1 || "").split(";").map(x => x.trim()).filter(Boolean);
  const chips = a => (a.length ? a : ["Ninguno"]).map(x => `<span class="chip${a.length ? "" : " none"}">${esc(x)}</span>`).join("");
  const f = S.cat[c.producto_1];

  $("#vista").innerHTML = `
<div class="back">
  <button class="btn sec sm" id="volver">← Volver a ${S.filtro === "Todas" ? "mis cuentas" : "cuentas " + S.filtro}</button>
  <div class="tools"><span class="s" style="font-size:12px;color:var(--muted)">${i + 1} de ${lista_.length}</span>
    <button class="btn sec sm" id="ant" ${i <= 0 ? "disabled" : ""}>‹ Anterior</button>
    <button class="btn sec sm" id="sig" ${i < 0 || i >= lista_.length - 1 ? "disabled" : ""}>Siguiente ›</button></div>
</div>
<div class="cab">
  <div><h1>${esc(c.empresa)}</h1>
    <div class="metas"><span>${esc(c.MACRO)}</span><span>${esc(c.pais || "N/D")}</span>
      <span class="badge dot ${c.es_cliente ? "lv-ok" : "lv-mid"}">${c.es_cliente ? "Cliente actual" : "Prospecto"}</span>
      ${c.deal_abierto ? `<span class="badge dot lv-warn">Deal abierto</span>` : ""}</div></div>
  <div class="prio lv-${PRIO[c.prioridad] || "mid"}"><div><small>Prioridad · score final</small><b>${c.prioridad}</b></div><div class="pn">${c.score_final.toFixed(1)}</div></div>
</div>

<div class="grid">
  <div class="card hero lv-${lvFit}">
    <div class="eyebrow">Producto propio sugerido</div>
    <div class="reco">${esc(c.producto_1 || "Sin sugerencia")}</div>
    <div class="hero-badges"><span class="badge dot">${fitTxt(fit)} · ${fit.toFixed(2)}</span>
      ${c.estado_1 ? `<span class="badge neutral">${esc(c.estado_1)}</span>` : ""}
      ${c.producto_2 ? `<span class="badge neutral">Alternativa: ${esc(c.producto_2)}</span>` : ""}</div>
    ${razones.length ? `<div class="sub-title">Por qué</div><ul class="why">${razones.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    <div class="two" style="margin-top:6px">
      <div><div class="sub-title">Ya compra (Google)</div><div class="chips">${chips(c.google_comprados)}</div></div>
      <div><div class="sub-title">Producto propio actual</div><div class="chips">${chips(c.pp_ganadas)}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="eyebrow">Score de la cuenta</div>
    <div class="score-top lv-${lvScore}"><div class="ring" style="--p:${c.score_cuenta}"><div><b>${c.score_cuenta}</b><small>/100</small></div></div>
      <div><div class="lbl">Fuerza de la cuenta</div><div class="val">${scoreTxt(c.score_cuenta)}</div></div></div>
    ${filas}
    <p class="nota"><b>${c.score_cuenta}</b> (cuenta) × <b>${fit.toFixed(2)}</b> (fit) = <b>${c.score_final.toFixed(1)}</b> score final</p>
  </div>
</div>

${f ? `<div class="card" style="margin-bottom:18px"><div class="eyebrow">Cómo abordar esta cuenta · ${esc(f.nombre)}</div>${fichaHTML(f)}</div>` : ""}

<div class="card">
  <div class="eyebrow">Plan personalizado con IA</div>
  <div id="plan"><p class="hint">Cruza lo que esta cuenta ya compra con el producto sugerido y propone un ángulo de entrada. Es opcional: la guía de arriba ya sirve para llamar.</p>
    <button class="btn" id="gen">Generar plan</button></div>
  <div class="chat" id="chat" hidden>
    <div class="msgs" id="msgs"></div>
    <div class="fila"><input id="qchat" type="text" placeholder="Pregunta sobre esta cuenta…" maxlength="600"><button class="btn sec" id="env">Enviar</button></div>
    <div id="cerr" class="err"></div>
  </div>
</div>`;
  window.scrollTo(0, 0); $("main").scrollTop = 0;
  $("#ant").onclick = () => abrir(lista_[i - 1].emp);
  $("#sig").onclick = () => abrir(lista_[i + 1].emp);
  $("#gen").onclick = generarPlan;
  $("#env").onclick = preguntar;
  $("#qchat").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); preguntar(); } };
}

async function generarPlan() {
  const b = $("#gen"); b.disabled = true; b.textContent = "Preparando…";
  try {
    const d = await api("/api/plan", { emp: S.actual.emp });
    $("#plan").innerHTML = planHTML(d.texto);
    $("#chat").hidden = false; $("#msgs").innerHTML = ""; S.historial = [];
  } catch (e) {
    b.disabled = false; b.textContent = "Generar plan";
    $("#plan").insertAdjacentHTML("beforeend", `<p class="err">${esc(e.message)}</p>`);
  }
  uso();
}

async function preguntar() {
  const q = $("#qchat").value.trim(); if (!q) return;
  $("#qchat").value = ""; $("#cerr").textContent = "";
  $("#msgs").insertAdjacentHTML("beforeend", `<div class="msg u">${esc(q)}</div><div class="msg a cargando" id="tmp">Pensando…</div>`);
  try {
    const d = await api("/api/chat", { emp: S.actual.emp, pregunta: q, historial: S.historial });
    S.historial.push({ role: "user", content: q }, { role: "assistant", content: d.texto });
    $("#tmp").outerHTML = `<div class="msg a">${md(esc(d.texto))}</div>`;
    $("#msgs").scrollTop = $("#msgs").scrollHeight;
  } catch (e) { $("#tmp").remove(); $("#cerr").textContent = e.message; }
  uso();
}

/* ---------- exportar vista actual (abre en Excel) ---------- */
const descargar = () => {
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const enc = ["Empresa","Industria","País","Prioridad","Score final","Score cuenta","Producto 1","Fit","Producto 2","Ya compra (Google)","Producto propio actual","Cliente","Deal abierto","Por qué","Sponsor","Gancho","Pregunta clave","Señales de compra"];
  const filas = visibles().map(c => {
    const f = S.cat[c.producto_1];
    return [c.empresa, c.MACRO, c.pais, c.prioridad, c.score_final, c.score_cuenta, c.producto_1, c.fit_1, c.producto_2,
      (c.google_comprados || []).join(", "), (c.pp_ganadas || []).join(", "), c.es_cliente ? "Sí" : "No", c.deal_abierto ? "Sí" : "No", c.razon_1,
      f ? f.sponsor : "", f ? f.gancho : "", f ? (f.preguntas[0] || "") : "", f ? f.senales.join("; ") : ""].map(cell).join(",");
  });
  const blob = new Blob(["﻿" + [enc.map(cell).join(","), ...filas].join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `whitespace_${norm($("#ejec").value).replace(/\s+/g, "_")}_${S.filtro.toLowerCase()}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- orquestación ---------- */
const render = () => {
  S.vista = S.vista === "detalle" ? "cuentas" : S.vista;
  $("#nav").hidden = false;
  $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === S.vista));
  pintarFiltros();
  S.vista === "productos" ? pintarProductos() : pintarCuentas();
};

const uso = async () => {
  try {
    const d = await api("/api/uso"), pct = (d.usd / d.tope) * 100;
    $("#usoTxt").textContent = `USD ${d.usd.toFixed(2)} / ${d.tope}`;
    $("#usoBar").style.width = Math.min(pct, 100) + "%";
    $("#usoBox").className = "uso lv-" + (pct < 60 ? "ok" : pct < 85 ? "warn" : "bad");
  } catch (e) {}
};

let ultimaCarga = 0;
async function cargarEjecutivo(nombre) {
  if (!nombre) return;
  const mia = ++ultimaCarga;
  // Limpia de inmediato lo del ejecutivo anterior para que el cambio sea visible
  S.cuentas = []; S.actual = null; S.vista = "cuentas";
  $("#nav").hidden = true; $("#kpis").hidden = true;
  $("#vista").innerHTML = `<div class="vacio"><p class="cargando">Cargando cuentas de ${esc(nombre)}…</p></div>`;
  let datos;
  try { datos = await api("/api/cuentas?owner=" + encodeURIComponent(nombre)); }
  catch (e) { if (mia === ultimaCarga) $("#vista").innerHTML = `<div class="vacio"><h2>No pude cargar las cuentas</h2><p class="err">${esc(e.message)}</p></div>`; return; }
  if (mia !== ultimaCarga) return; // el usuario ya eligió a otro ejecutivo
  S.cuentas = datos;
  S.filtro = "Todas"; S.q = ""; $("#q").value = ""; S.sort = { k: "prio", d: 1 };
  try { localStorage.setItem("ws_ejec", nombre); } catch (e) {}
  pintarKpis();
  if (!S.cuentas.length) { $("#nav").hidden = true; $("#vista").innerHTML = `<div class="vacio"><h2>Sin cuentas</h2><p>Este ejecutivo no tiene cuentas asignadas.</p></div>`; return; }
  render();
}

$("#ejec").onchange = e => { cargarEjecutivo(e.target.value); uso(); };
$("#q").oninput = e => { S.q = e.target.value; S.vista === "productos" ? pintarProductos() : pintarCuentas(); };
$("#btnCsv").onclick = descargar;

document.addEventListener("click", e => {
  const t = e.target.closest("[data-v],[data-f],[data-s],tr[data-id],button[data-id],#volver");
  if (!t) return;
  if (t.id === "volver") return render();
  if (t.dataset.v) { S.vista = t.dataset.v; return render(); }
  if (t.dataset.f) { S.filtro = t.dataset.f; return render(); }
  if (t.dataset.s) { S.sort = { k: t.dataset.s, d: S.sort.k === t.dataset.s ? -S.sort.d : 1 }; return pintarCuentas(); }
  if (t.dataset.id) abrir(Number(t.dataset.id));
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-id]")) abrir(Number(e.target.dataset.id)); });

(async () => {
  const [ej, cat] = await Promise.all([api("/api/ejecutivos"), api("/api/catalogo").catch(() => ({}))]);
  S.cat = cat;
  $("#ejec").insertAdjacentHTML("beforeend", ej.map(e => `<option value="${esc(e.nombre)}">${esc(e.nombre)} (${e.cuentas})</option>`).join(""));
  let guardado = ""; try { guardado = localStorage.getItem("ws_ejec") || ""; } catch (e) {}
  if (ej.some(e => e.nombre === guardado)) { $("#ejec").value = guardado; cargarEjecutivo(guardado); }
  uso();
})();
</script>
</body>
</html>
